<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Lista de tareas</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; }
    input { padding: 6px; width: 70%; }
    button { padding: 6px 14px; cursor: pointer; }
    ul { list-style: none; padding: 0; margin-top: 16px; }
    li { margin-bottom: 8px; }
    .btn-eliminar { margin-left: 10px; color: red; background: none; border: 1px solid red; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Lista de tareas</h2>

  <input type="text" id="inputTarea" placeholder="Nueva tarea..."/>
  <button id="btnAgregar">Agregar</button>

  <ul id="listaTareas"></ul>

  <script src="js/app.js"></script>
</body>
</html>
